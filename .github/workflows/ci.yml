name: ci

# Type check and unit tests on each pull request and each push to main. The tests
# are hermetic: no network, no store.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
