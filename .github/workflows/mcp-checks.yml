name: mcp-checks

# Runs each producer's probe file against the public docs MCP endpoint with the
# package's runner (src/checks.ts). It blocks no other repository. On a schedule,
# a dispatch or a push to main, a failure opens or updates one tracking issue, a
# pass closes it, and each change of state sends a Zulip direct message. A
# pull-request run only checks, so a runner change must keep every probe file
# passing. The Zulip direct message goes out when the checks start failing,
# when they pass again, and on every other passing run, so a quiet day means
# the workflow did not run; a run that is still failing only comments on the
# issue.
#
# Each producer keeps its probe files beside its index roots: nym in
# documentation/mcp-probes/, nym-vpn-client in .github/indexer/mcp-probes.json.
# The repository variables NYM_PROBES_REF and VPN_PROBES_REF pick the ref to
# read each from (default develop).
#
# Zulip secrets, all optional: ZULIP_SITE (the server's base URL, for example
# https://zulip.example.org), ZULIP_BOT_EMAIL, ZULIP_BOT_API_KEY, ZULIP_ALERT_TO
# (a JSON list of user ids or emails, for example [12345]), and ZULIP_CA_CERT
# (PEM text, for a server with a private CA). With no API key, no message is
# sent. The step masks the server's host name, because the logs of this
# repository are public. The report job runs on vars.REPORT_RUNNER (default
# ubuntu-latest); set it to a runner label inside the network when the server
# is not reachable from GitHub-hosted runners.
#
# GitHub turns off a scheduled workflow after 60 days with no commit to the
# repository; re-enable it from the Actions tab.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      endpoint:
        description: MCP endpoint URL
        type: string
        default: https://nym.com/docs/api/mcp
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mcp-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  ENDPOINT: ${{ inputs.endpoint || 'https://nym.com/docs/api/mcp' }}
  NYM_PROBES: https://raw.githubusercontent.com/nymtech/nym/${{ vars.NYM_PROBES_REF || 'develop' }}/documentation/mcp-probes
  VPN_PROBES: https://raw.githubusercontent.com/nymtech/nym-vpn-client/${{ vars.VPN_PROBES_REF || 'develop' }}/.github/indexer/mcp-probes.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      summary: ${{ steps.probes.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      # The prepare script builds dist/.
      - run: pnpm install --frozen-lockfile
      - name: Run the probe files
        id: probes
        run: |
          set -o pipefail
          RC=0
          node dist/checks-cli.js "$ENDPOINT" "$NYM_PROBES/server.json" "$NYM_PROBES/retrieval.json" "$VPN_PROBES" | tee "$RUNNER_TEMP/checks.txt" || RC=$?
          echo "summary=$(grep -E '^[0-9]+ passed, [0-9]+ failed' "$RUNNER_TEMP/checks.txt" | tail -1)" >> "$GITHUB_OUTPUT"
          exit "$RC"

  report:
    needs: check
    if: always() && github.event_name != 'pull_request'
    runs-on: ${{ vars.REPORT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.check.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="MCP checks failing"
          OPEN=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          STATE=passing
          if [ "$RESULT" = success ]; then
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" -R "$GITHUB_REPOSITORY" -c "Passing again: $RUN_URL"
              STATE=closed
            fi
          elif [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" -R "$GITHUB_REPOSITORY" -b "Still failing ($GITHUB_EVENT_NAME): $RUN_URL"
            STATE=still
          else
            gh issue create -R "$GITHUB_REPOSITORY" -t "$TITLE" -b "The MCP checks against \`$ENDPOINT\` failed ($GITHUB_EVENT_NAME): $RUN_URL. The run summary lists each failing check. The next passing run closes this issue."
            STATE=opened
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      - name: Send a Zulip direct message
        if: steps.issue.outputs.state != 'still'
        continue-on-error: true
        env:
          ZULIP_SITE: ${{ secrets.ZULIP_SITE }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_BOT_API_KEY: ${{ secrets.ZULIP_BOT_API_KEY }}
          ZULIP_ALERT_TO: ${{ secrets.ZULIP_ALERT_TO }}
          ZULIP_CA_CERT: ${{ secrets.ZULIP_CA_CERT }}
          STATE: ${{ steps.issue.outputs.state }}
          SUMMARY: ${{ needs.check.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${ZULIP_BOT_API_KEY:-}" ]; then
            echo "The Zulip secrets are not set; no message sent."
            exit 0
          fi
          HOST="${ZULIP_SITE#*://}"
          HOST="${HOST%%/*}"
          echo "::add-mask::$HOST"
          echo "::add-mask::${HOST%%:*}"
          CA=()
          if [ -n "${ZULIP_CA_CERT:-}" ]; then
            printf '%s\n' "$ZULIP_CA_CERT" > "$RUNNER_TEMP/zulip-ca.pem"
            CA=(--cacert "$RUNNER_TEMP/zulip-ca.pem")
          fi
          COUNTS="${SUMMARY:+ ($SUMMARY)}"
          case "$STATE" in
            opened) TEXT="MCP checks failing$COUNTS against $ENDPOINT ($GITHUB_EVENT_NAME): $RUN_URL" ;;
            closed) TEXT="MCP checks passing again$COUNTS ($GITHUB_EVENT_NAME): $RUN_URL" ;;
            *) TEXT="MCP checks passing$COUNTS ($GITHUB_EVENT_NAME): $RUN_URL" ;;
          esac
          # The host is masked above, so Zulip's reply and curl's errors are safe to print.
          RC=0
          STATUS=$(curl -sS -o "$RUNNER_TEMP/zulip.json" -w '%{http_code}' --max-time 60 "${CA[@]}" -u "$ZULIP_BOT_EMAIL:$ZULIP_BOT_API_KEY" \
            --data-urlencode type=direct --data-urlencode "to=$ZULIP_ALERT_TO" --data-urlencode "content=$TEXT" \
            "$ZULIP_SITE/api/v1/messages") || RC=$?
          if [ "$RC" -ne 0 ] || [ "$STATUS" != 200 ]; then
            echo "::warning::The Zulip message was not sent (curl exit $RC, HTTP ${STATUS:-none}): $(jq -r '.msg // empty' "$RUNNER_TEMP/zulip.json" 2>/dev/null)"
            exit 1
          fi
          echo "Zulip message sent."
